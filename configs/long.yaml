total_timesteps: 800000
evaluation_episodes: 20

physics:
  gravity: 9.81
  cart_mass_kg: 1.0
  pole_mass_kg: 0.1
  pole_com_length_m: 0.5
  max_force_n: 10.0
  cart_viscous_friction_n_per_mps: 0.10
  motor_time_constant_s: 0.05
  dt_s: 0.02
  track_limit_m: 2.4
  max_episode_s: 20.0

sensor_noise:
  enabled: true
  position_noise_std_m: 0.001
  position_bias_std_m: 0.002
  velocity_noise_std_mps: 0.01
  velocity_bias_std_mps: 0.01
  angle_noise_std_deg: 0.25
  angle_bias_std_deg: 1.0
  gyro_noise_std_dps: 0.10
  gyro_bias_std_dps: 0.30

td3:
  learning_rate: 0.001
  buffer_size: 1000000
  learning_starts: 5000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  action_noise_sigma: 0.20
  policy_delay: 2
  target_policy_noise: 0.20
  target_noise_clip: 0.50
  net_arch: [256, 256]

curriculum:
  - {stage: 25_percent, reset_mode: near_upright, fraction: 0.25}
  - {stage: 50_percent, reset_mode: wide, fraction: 0.50}
  - {stage: 75_percent, reset_mode: full, fraction: 0.75}
  - {stage: 100_percent, reset_mode: downward_mix, fraction: 1.00}
